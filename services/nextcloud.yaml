services:
  nextcloud:
    image: nextcloud:33.0.2-apache
    restart: unless-stopped
    hostname: 'cloud.home.emadelsaid.com'
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nextcloud.rule=Host(`cloud.home.emadelsaid.com`)"
      - "traefik.http.services.nextcloud.loadbalancer.server.port=80"
    logging:
      driver: journald
    volumes:
      - '/home/docker/services/nextcloud/html:/var/www/html'
      - '/home/docker/services/nextcloud/data:/var/www/html/data'
    environment:
      - 'MYSQL_HOST=nextcloud_db'
      - 'MYSQL_DATABASE=nextcloud'
      - 'MYSQL_USER=nextcloud'
      - 'MYSQL_PASSWORD=nextcloud'
      - 'NEXTCLOUD_ADMIN_USER=admin'
      - 'NEXTCLOUD_ADMIN_PASSWORD=admin'
      - 'NEXTCLOUD_TRUSTED_DOMAINS=cloud.home.emadelsaid.com'
      - 'OVERWRITEPROTOCOL=http'
    depends_on:
      - nextcloud_db

  nextcloud_db:
    image: mariadb:11.6.2
    restart: unless-stopped
    command:
      - --transaction-isolation=READ-COMMITTED
      - --log-bin=binlog
      - --binlog-format=ROW
    logging:
      driver: journald
    volumes:
      - '/home/docker/services/nextcloud/db:/var/lib/mysql'
    environment:
      - 'MYSQL_ROOT_PASSWORD=nextcloud'
      - 'MYSQL_DATABASE=nextcloud'
      - 'MYSQL_USER=nextcloud'
      - 'MYSQL_PASSWORD=nextcloud'
