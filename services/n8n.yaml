services:
  n8n:
    image: n8nio/n8n:2.22.2
    restart: unless-stopped
    hostname: 'n8n.home.emadelsaid.com'
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.n8n.rule=Host(`n8n.home.emadelsaid.com`)"
      - "traefik.http.services.n8n.loadbalancer.server.port=80"
    logging:
      driver: journald
    environment:
      - 'N8N_HOST=n8n.home.emadelsaid.com'
      - 'N8N_PORT=80'
      # Public URLs are https even though Traefik forwards plain HTTP to :80.
      - 'N8N_PROTOCOL=https'
      - 'N8N_SECURE_COOKIE=true'
    volumes:
      - '/home/docker/services/n8n:/home/node/.n8n'

