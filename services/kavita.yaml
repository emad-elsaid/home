services:
  kavita:
    # kizaing/kavita is abandoned (last push 2024-01); jvmilazz0 is the maintained repo.
    image: jvmilazz0/kavita:0.9.1

    restart: unless-stopped
    logging:
      driver: journald

    labels:
      - "traefik.http.routers.kavita.rule=Host(`books.home.emadelsaid.com`)"
    volumes:
      - /home/docker/Documents:/Documents
      - /home/docker/services/kavita:/kavita/config
